<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>MPloyChek Portal</h2>
      <p>Sign in to access your verification panel</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="userId">User ID</label>
        <input type="text" id="userId" [(ngModel)]="userId" name="userId" placeholder="Enter your User ID" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
      </div>

      <div class="form-group">
        <label for="role">Portal Access Role</label>
        <select id="role" [(ngModel)]="selectedRole" name="selectedRole" required>
          <option value="" disabled selected>Select your designated role</option>
          <option value="General User">General User</option>
          <option value="Admin">Admin</option>
        </select>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="login-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Sign In securely' }}
      </button>
    </form>
  </div>
</div>
